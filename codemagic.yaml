# IMPERIUM som iOS-app: Codemagic bygger app/ (Capacitor) på en Mac i molnet och skickar bygget till TestFlight –
# samma upplägg som Smartphone Empire (8bitcat/mobilfabriken). Spelet är webbspelet v4: app/build.mjs kopierar det
# till app/www och lägger biblioteken, världskartan, typsnittet och flaggorna lokalt.
#   Starta: node D:/GamesProjects/snabbfilen/app/tools/codemagic.mjs start <codemagicAppId> ios-testflight main
#   Signering helt automatisk: bygget hämtar eller skapar App ID och App Store-profil via App Store Connect API
#   (integrationen "Codemagic") med certifikatet "Apple Distribution" XVHF37T5LZ, vars nyckel ligger som hemlig
#   CERTIFICATE_PRIVATE_KEY i gruppen apple_signing (läggs av mobilfabriken/app/tools/ny-app.mjs).
#   APP_STORE_APPLE_ID = App Store Connect → appen → App Information → Apple ID (finns när appen fått sitt namn).
workflows:
  ios-testflight:
    name: iOS → TestFlight (IMPERIUM)
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - apple_signing
      vars:
        BUNDLE_ID: io.eightbitcat.imperium
        APP_STORE_APPLE_ID: 6840295031    # Imperium: Laws & Nations i App Store Connect (App Information → Apple ID)
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Installera
        script: cd app && npm ci
      - name: Spelet in i appen
        script: cd app && node build.mjs && npx cap sync ios && node tools/ios-plist.mjs
      - name: Signering (App ID, profil och certifikat hämtas eller skapas via API)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: Version och byggnummer
        script: |
          VERSION=$(node -p "require('./app/package.json').appVersion")
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$((LATEST + 1))
          echo "IMPERIUM $VERSION (bygge $BUILD)"
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD;/" app/ios/App/App.xcodeproj/project.pbxproj
      - name: Bygg ipa
        script: |
          cd app/ios/App
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" || {
            echo "--- felen från xcodebuild ---"
            grep -h -E "error:|Provisioning profile|doesn't (include|support|match)" /tmp/xcodebuild_logs/*.log | sort -u | head -40
            exit 1
          }
    artifacts:
      - app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
